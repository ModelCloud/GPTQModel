name: Ruff Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      # Strict gate: never rewrites files, so a violation fails the job.
      # Autofixing is local-only via format/format.sh.
      - name: Ruff Check
        run: |
          format/check.sh
