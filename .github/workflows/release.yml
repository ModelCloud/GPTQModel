name: Release

run-name: "${{ github.event.inputs.title }}"

defaults:
  run:
    shell: bash -le {0}

on:
  release:
    types: [ published ]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      title:
        description: 'set a title for this run'
        required: false
        default: ''
      repo:
        description: 'GitHub repo {owner}/{repo}'
        required: false
        default: ''
      ref:
        description: 'GitHub ref: Branch, Tag or Commit SHA'
        required: false
        default: ''
      pr_number:
        description: 'PR Number'
        required: false
        type: number
      upload_release:
        description: 'upload to release (it only works with a tag ref)'
        type: boolean
        required: false
        default: false
      upload_pypi:
        description: 'upload to PyPI'
        type: boolean
        required: false
        default: false
      github_vm:
        description: 'release source on github vm'
        type: boolean
        required: false
        default: false

env:
  PYTHON_GIL: '0'
  RUNNER: 10.0.13.31
  repo: ${{ github.event.inputs.repo || github.repository }}
  ref: ${{ github.event.inputs.ref || github.ref }}

concurrency:
  group: ${{ github.event.inputs.ref || github.ref }}-workflow-release
  cancel-in-progress: true

jobs:
  release-source:
    permissions:
      contents: write
    runs-on: [ self-hosted, xeon5 ]
    if: ${{ inputs.github_vm == false }}
    env:
      UV_CACHE_DIR: /opt/gptqmodel/uv-cache
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:0e1f7b8e96fa9ec5e36d4709a38c62df7b5665977446081811c12b8234d874bf
      volumes:
        - /github/workspace/uv/cache:/opt/gptqmodel/uv-cache
        - /monster/ci/dist:/opt/dist
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git ninja-build

      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci-runtime
        with:
          python-version: '3.14.10t'
          source-build: 'true'

      - name: Run shared release source flow
        uses: ./.github/actions/release-source-common
        with:
          pr-number: ${{ github.event.inputs.pr_number || 0 }}
          run-id: ${{ github.run_id }}
          confirmation-mode: manual
          test-install: 'true'
          upload-local: 'true'
          artifact-continue-on-error: 'true'
          require-pypi-confirmation: 'true'
          publish: 'true'
          pypi-token: ${{ secrets.PYPI_KEY }}

  release-source-github:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    if: ${{ inputs.github_vm == true }}
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:0e1f7b8e96fa9ec5e36d4709a38c62df7b5665977446081811c12b8234d874bf
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git ninja-build

      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci-runtime
        with:
          python-version: '3.14.10t'
          source-build: 'true'

      - name: Run shared release source flow
        uses: ./.github/actions/release-source-common
        with:
          pr-number: ${{ github.event.inputs.pr_number || 0 }}
          confirmation-mode: sleep
          test-install: 'true'
          upload-local: 'false'
          artifact-continue-on-error: 'false'
          require-pypi-confirmation: 'false'
          publish: 'true'
          pypi-token: ${{ secrets.PYPI_KEY }}
