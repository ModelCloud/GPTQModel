name: Unit Tests

run-name: "${{ github.event.inputs.title }}"

defaults:
  run:
    shell: bash -le {0}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      title:
        description: 'set a title for this run'
        required: false
        default: ''
      repo:
        description: 'GitHub repo {owner}/{repo}'
        required: false
        default: ''
      ref:
        description: 'GitHub ref: Branch, Tag or Commit SHA'
        required: false
        default: ''
      pr_number:
        description: 'PR Number'
        required: false
        type: number
      test_regex:
        description: 'Regex to filter test files'
        required: false
        default: ''
      max-parallel:
        description: 'Parallel jobs'
        required: false
        default: '4'
      model-test-mode:
        description: 'Model compat test mode'
        type: choice
        required: false
        default: 'fast'
        options:
          - 'fast'
          - 'slow'
      server:
        description: 'Wheel Build Server'
        type: choice
        default: '["self-hosted", "xeon5"]'
        options:
          - '["self-hosted", "xeon5"]'
          - '["self-hosted", "zen4"]'

env:
  PYTHON_GIL: '0'
  CUDA_DEVICE_ORDER: PCI_BUS_ID
  CUDA_VISIBLE_DEVICES: 0
  # Force fresh torch.ops JIT builds in CI so heterogeneous GPUs never reuse
  # cached kernels compiled by earlier jobs/tests.
  GPTQMODEL_KERNEL_REBUILD: '1'
  # CI can allocate A100-class devices (sm_80), so the shared JIT arch list
  # must include 8.0 in addition to the newer targets.
  TORCH_CUDA_ARCH_LIST: 8.0;8.6;8.9;9.0;12.0
  PYTORCH_ALLOC_CONF: 'expandable_segments:True'
  RUNNER: 10.0.13.31
  XEON5: 10.0.14.249
  GPU_ALLOCATOR_URL: http://10.0.13.31/gpu
  LOGBAR_ANIMATION: '0'
  IGNORED_TEST_FILES: "test_tgi.py,test_gptneox.py,models/test_mixtral.py,models/test_phi_3_moe.py,test_bits_new.py,models/test_internlm.py,models/test_internlm2_5.py,models/test_xverse.py"
  MODEL_TEST_MODE: ${{ github.event.inputs['model-test-mode'] || 'fast' }}
  MODEL_TEST_GPU_COUNT: '1'
  DEFUSER_GIT_URL: git+https://github.com/modelcloud/Defuser.git
  PYPCRE_GIT_URL: git+https://github.com/modelcloud/PyPcre.git
  TOKENICER_GIT_URL: git+https://github.com/modelcloud/Tokenicer.git
  LOGBAR_GIT_URL: git+https://github.com/modelcloud/LogBar.git
  EVALUTION_GIT_URL: git+https://github.com/modelcloud/Evalution.git
  repo: ${{ github.event.inputs.repo || github.repository }}
  ref: ${{ github.event.inputs.ref || github.ref }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

concurrency:
  group: ${{ github.event.inputs.ref || github.ref }}-workflow-unit-tests #-${{ github.event.inputs.test_names }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-vm:
    runs-on: ubuntu-latest
    outputs:
      max-parallel: ${{ steps.get_ip.outputs['max-parallel'] }}
    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Print env
        run: |
          echo "repo: ${{ env.repo }}"
          echo "ref: ${{ env.ref }}"
          echo "selected server: ${{ github.event.inputs.server }}"

      - name: Set server
        id: get_ip
        run: |
          bash .github/scripts/ci_write_runner_outputs.sh \
            "$RUNNER" \
            "${{ github.run_id }}" \
            "${{ github.event.inputs['max-parallel'] }}"

  list-test-files:
    runs-on: ubuntu-latest
    outputs:
      cpu-files: ${{ steps.files.outputs.cpu-files }}
      torch-files: ${{ steps.files.outputs.torch-files }}
      model-files: ${{ steps.files.outputs.model-files }}
      m4-files: ${{ steps.files.outputs.m4-files }}
      cpu-shards: ${{ steps.files.outputs.cpu-shards }}
      torch-shards: ${{ steps.files.outputs.torch-shards }}
      model-shards: ${{ steps.files.outputs.model-shards }}
      cpu-shard-indexes: ${{ steps.files.outputs.cpu-shard-indexes }}
      torch-shard-indexes: ${{ steps.files.outputs.torch-shard-indexes }}
      model-shard-indexes: ${{ steps.files.outputs.model-shard-indexes }}

    steps:
      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Prepare checkout
        run: |
          .github/scripts/ci_prepare_checkout.sh "${{ github.event.inputs.pr_number }}"

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci-runtime
        with:
          python-version: '3.14.10t'

      - name: List files
        id: files
        run: |
          uv pip install pyyaml
          plan_file="$RUNNER_TEMP/unit-test-plan.json"
          python .github/scripts/ci_workflow.py list-tests \
            --ignored-test-files "$IGNORED_TEST_FILES" \
            --test-regex "${{ github.event.inputs.test_regex }}" \
            > "$plan_file"

          python - "$plan_file" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              plan = json.load(fh)

          def emit(name, value):
              print(f"{name}={json.dumps(value)}")

          emit("cpu-files", plan["cpu_files"])
          emit("torch-files", plan["torch_files"])
          emit("model-files", plan["model_files"])
          emit("m4-files", plan["mlx_files"])
          for group in ("cpu", "torch", "model"):
              shards = plan[f"{group}_matrix_shards"]
              emit(f"{group}-shards", shards)
              emit(f"{group}-shard-indexes", list(range(len(shards))))
          PY

          python - "$plan_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              plan = json.load(fh)

          for group in ("cpu", "torch", "model"):
              entries = plan[f"{group}_matrix"]
              shards = plan[f"{group}_matrix_shards"]
              print(f"{group} tests: {len(entries)} in {len(shards)} shard(s)")
          print(f"MLX test files: {len(plan['mlx_files'])}")
          PY
          echo "Ignored Test files: $IGNORED_TEST_FILES"

  cpu:
    needs:
      - list-test-files
      - check-vm
    if: always() && !cancelled() && needs.list-test-files.result == 'success' && needs.list-test-files.outputs.cpu-shard-indexes != '[]'
    strategy:
      fail-fast: false
      # Shards exist only to stay under the per-matrix expansion limit. Keep a
      # single shard call active so the inner matrix concurrency is unchanged.
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.list-test-files.outputs.cpu-shard-indexes || '[0]') }}
    uses: ./.github/workflows/unit_tests_reusable.yml
    secrets: inherit
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || '0') }}
      check_vm_max_parallel: ${{ needs.check-vm.outputs['max-parallel'] }}
      matrix_json: ${{ toJSON(fromJSON(needs.list-test-files.outputs.cpu-shards || '[[]]')[matrix.shard]) }}
      model_test_mode: ${{ github.event.inputs['model-test-mode'] || 'fast' }}

  torch:
    needs:
      - list-test-files
      - check-vm
    if: always() && !cancelled() && needs.list-test-files.result == 'success' && needs.list-test-files.outputs.torch-shard-indexes != '[]'
    strategy:
      fail-fast: false
      # Shards exist only to stay under the per-matrix expansion limit. Keep a
      # single shard call active so the inner matrix concurrency is unchanged.
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.list-test-files.outputs.torch-shard-indexes || '[0]') }}
    uses: ./.github/workflows/unit_tests_reusable.yml
    secrets: inherit
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || '0') }}
      check_vm_max_parallel: ${{ needs.check-vm.outputs['max-parallel'] }}
      matrix_json: ${{ toJSON(fromJSON(needs.list-test-files.outputs.torch-shards || '[[]]')[matrix.shard]) }}
      model_test_mode: ${{ github.event.inputs['model-test-mode'] || 'fast' }}

  models:
    needs:
      - list-test-files
      - check-vm
    if: always() && !cancelled() && needs.list-test-files.result == 'success' && needs.list-test-files.outputs.model-shard-indexes != '[]'
    strategy:
      fail-fast: false
      # Shards exist only to stay under the per-matrix expansion limit. Keep a
      # single shard call active so the inner matrix concurrency is unchanged.
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.list-test-files.outputs.model-shard-indexes || '[0]') }}
    uses: ./.github/workflows/unit_tests_reusable.yml
    secrets: inherit
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || '0') }}
      check_vm_max_parallel: ${{ needs.check-vm.outputs['max-parallel'] }}
      matrix_json: ${{ toJSON(fromJSON(needs.list-test-files.outputs.model-shards || '[[]]')[matrix.shard]) }}
      model_test_mode: ${{ github.event.inputs['model-test-mode'] || 'fast' }}

  # Keep bounded tests for CPU thread pools and locks, GPU stream handoff,
  # and two-GPU P2P and native-kernel ownership.
  free-threaded:
    needs:
      - check-vm
    if: always() && !cancelled()
    uses: ./.github/workflows/unit_tests_reusable.yml
    secrets: inherit
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || '0') }}
      check_vm_max_parallel: ${{ needs.check-vm.outputs['max-parallel'] }}
      matrix_json: |
        [
          {"test_script": "test_threadx_cpu_locks", "test_group": "cpu", "alloc_gpu_count": "0", "require_single_gpu": "false", "include_model_test_mode": "false"},
          {"test_script": "test_threadx_shutdown", "test_group": "cpu", "alloc_gpu_count": "0", "require_single_gpu": "false", "include_model_test_mode": "false"},
          {"test_script": "test_looper_concurrency", "test_group": "cpu", "alloc_gpu_count": "0", "require_single_gpu": "false", "include_model_test_mode": "false"},
          {"test_script": "test_checkpoint_store", "test_group": "cpu", "alloc_gpu_count": "0", "require_single_gpu": "false", "include_model_test_mode": "false"},
          {"test_script": "test_stream", "test_group": "torch", "alloc_gpu_count": "1", "require_single_gpu": "true", "include_model_test_mode": "false"},
          {"test_script": "test_thread_pool_exit", "test_group": "torch", "alloc_gpu_count": "1", "require_single_gpu": "true", "include_model_test_mode": "false"},
          {"test_script": "test_p2p", "test_group": "torch", "alloc_gpu_count": "2", "require_single_gpu": "false", "include_model_test_mode": "false"},
          {"test_script": "test_p2p_copy_utils", "test_group": "torch", "alloc_gpu_count": "2", "require_single_gpu": "false", "include_model_test_mode": "false"}
        ]

  check-torch:
    runs-on: [ self-hosted, xeon5 ]
    env:
      UV_CACHE_DIR: /opt/gptqmodel/uv-cache
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:0e1f7b8e96fa9ec5e36d4709a38c62df7b5665977446081811c12b8234d874bf
      volumes:
        - /github/workspace/uv/cache:/opt/gptqmodel/uv-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test pypi pip
            use_pip: 'true'
            target: gptqmodel
          - name: Test pypi uv
            use_pip: 'false'
            target: gptqmodel
          - name: Test local pip
            use_pip: 'true'
            target: .
          - name: Test local uv
            use_pip: 'false'
            target: .
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git ninja-build

      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Prepare checkout
        run: |
          .github/scripts/ci_prepare_checkout.sh "${{ github.event.inputs.pr_number }}"

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci-runtime
        with:
          python-version: '3.14.10t'
          source-build: 'true'

      - name: ${{ matrix.name }}
        env:
          INSTALL_TARGET: ${{ matrix.target }}
          USE_PIP: ${{ matrix.use_pip }}
        run: |
          constraint="$GITHUB_WORKSPACE/.github/ci/torch-cu132.txt"
          torch_index=https://download.pytorch.org/whl/cu132
          if [[ "$USE_PIP" == 'true' ]]; then
            uv pip install pip
            python -m pip install --extra-index-url "$torch_index" \
              --constraint "$constraint" torch "$INSTALL_TARGET"
          else
            uv pip install --torch-backend cu132 \
              --constraint "$constraint" torch "$INSTALL_TARGET"
          fi
          python -I -X gil=0 .github/scripts/ci_assert_free_threaded.py --installed

  setuptools-compatibility:
    uses: ./.github/workflows/setuptools_compatibility_reusable.yml
    with:
      repo: ${{ github.event.inputs.repo || github.repository }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      pr_number: ${{ fromJSON(github.event.inputs.pr_number || '0') }}
