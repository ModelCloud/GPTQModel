name: Unit Tests Reusable

defaults:
  run:
    shell: bash -le {0}

on:
  workflow_call:
    inputs:
      repo:
        description: "GitHub repo {owner}/{repo}"
        required: false
        default: ""
        type: string
      ref:
        description: "GitHub ref: Branch, Tag or Commit SHA"
        required: false
        default: ""
        type: string
      pr_number:
        description: "PR Number"
        required: false
        default: 0
        type: number
      check_vm_max_parallel:
        description: "Serialized max parallel payload"
        required: true
        type: string
      matrix_json:
        description: "Serialized unit test matrix for this reusable job"
        required: true
        type: string
      model_test_mode:
        description: "Model compat test mode"
        required: false
        default: "fast"
        type: string

permissions:
  contents: read

env:
  PYTHON_GIL: '0'
  UV_CACHE_DIR: /opt/gptqmodel/uv-cache
  CUDA_DEVICE_ORDER: PCI_BUS_ID
  CUDA_VISIBLE_DEVICES: 0
  GPTQMODEL_KERNEL_REBUILD: '1'
  TORCH_CUDA_ARCH_LIST: '8.0 8.6 8.9 9.0 12.0'
  PYTORCH_ALLOC_CONF: 'expandable_segments:True'
  RUNNER: 10.0.13.31
  XEON5: 10.0.14.249
  GPU_ALLOCATOR_URL: http://10.0.13.31/gpu
  LOGBAR_ANIMATION: '0'
  MODEL_TEST_MODE: ${{ inputs.model_test_mode || 'fast' }}
  MODEL_TEST_GPU_COUNT: '1'
  DEFUSER_GIT_URL: git+https://github.com/modelcloud/Defuser.git
  PYPCRE_GIT_URL: git+https://github.com/modelcloud/PyPcre.git
  TOKENICER_GIT_URL: git+https://github.com/modelcloud/Tokenicer.git
  LOGBAR_GIT_URL: git+https://github.com/modelcloud/LogBar.git
  EVALUTION_GIT_URL: git+https://github.com/modelcloud/Evalution.git
  repo: ${{ inputs.repo || github.repository }}
  ref: ${{ inputs.ref || github.ref }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  DEBUG_ON: 1

jobs:
  test:
    runs-on: [ self-hosted, xeon5 ]
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:0e1f7b8e96fa9ec5e36d4709a38c62df7b5665977446081811c12b8234d874bf
      options: --device /dev/dri --ipc=host --runtime=nvidia --gpus all
      volumes:
        - /github/workspace/uv/cache:/opt/gptqmodel/uv-cache
        - /dev/dri/by-path:/dev/dri/by-path
        - /monster/ci/models:/monster/data/model
        - /monster/ci/dataset:/monster/data/model/dataset
        - /monster/ci/huggingface:/github/home/.cache/huggingface
        - /monster/ci/dist:/opt/dist
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.check_vm_max_parallel).size || 20 }}
      matrix:
        include: ${{ fromJSON(inputs.matrix_json || '[]') }}
    if: ${{ !cancelled() && inputs.matrix_json != '[]' }}
    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git ninja-build

      - name: Checkout Codes
        uses: actions/checkout@v7
        with:
          repository: ${{ env.repo }}
          ref: ${{ env.ref }}

      - name: Prepare checkout
        run: |
          .github/scripts/ci_prepare_checkout.sh "${{ inputs.pr_number }}"

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci-runtime
        with:
          python-version: '3.14.10t'
          source-build: 'true'

      - name: Activate test environment
        run: |
          bash .github/scripts/ci_unit_activate_uv_env.sh \
            "${{ matrix.test_script }}" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}"

      - name: Install package from source
        env:
          UV_CONSTRAINT: ${{ github.workspace }}/.github/ci/torch-cu132.txt
        run: |
          uv pip install --torch-backend cu132 -r "$UV_CONSTRAINT"
          uv pip install build pytest pyyaml
          python .github/scripts/ci_deps.py install "${{ matrix.test_script }}"
          python .github/scripts/ci_deps.py uninstall "${{ matrix.test_script }}"
          uv pip install --torch-backend cu132 -r requirements.txt --index https://pypi.org/simple --default-index "http://$RUNNER/simple/" --allow-insecure-host "$RUNNER"
          python -m build --sdist
          uv pip install --torch-backend cu132 dist/*.tar.gz --index https://pypi.org/simple --default-index "http://$RUNNER/simple/" --allow-insecure-host "$RUNNER"
          bash .github/scripts/ci_install_modelcloud_git_deps.sh

      - name: Print uv env
        run: |
          echo "::group::uv python list"
          uv python list
          echo "::endgroup::"

          which python
          which pip || true
          python -V

          echo "::group::uv python list"
          uv python list
          echo "::endgroup::"

          echo "== nvcc =="
          nvcc --version

          echo "::group::project files"
          ls -ahl
          echo "::endgroup::"

          echo "== torch =="
          uv pip show torch

          echo "::group::pip list"
          uv pip list
          echo "::endgroup::"

      - name: Assert the GIL stays disabled after importing the model stack
        run: |
          python -I -X gil=0 .github/scripts/ci_assert_free_threaded.py --installed

      - name: Find suitable GPU
        if: ${{ !cancelled() && env.SKIP_GPU_ALLOCATION != 'true' }}
        run: |
          alloc_gpu_count="$GPU_COUNT"
          if [[ "${{ matrix.alloc_gpu_count }}" != "resolved" ]]; then
            alloc_gpu_count="${{ matrix.alloc_gpu_count }}"
          fi
          alloc_args=(
            --base-url "${GPU_ALLOCATOR_URL}"
            --run-id "${{ github.run_id }}"
            --test "${{ matrix.test_script }}"
            --runner "${RUNNER_NAME:-unknown}"
            --count "$alloc_gpu_count"
            --sm "${SM}"
          )
          if [[ "${{ matrix.require_single_gpu }}" == "true" ]]; then
            alloc_args+=(--require-single)
          fi
          python .github/scripts/ci_gpu.py allocate \
            "${alloc_args[@]}"

      - name: Run tests
        run: |
          extra_args=()
          if [[ "${XPU_MODE}" == "true" ]]; then
            extra_args+=(--clear-cuda --xpu-mode)
          fi
          if [[ "${{ matrix.include_model_test_mode }}" == "true" ]]; then
            extra_args+=(--model-test-mode "${MODEL_TEST_MODE}")
          fi
          python .github/scripts/ci_tests.py run \
            --base-url "${GPU_ALLOCATOR_URL}" \
            --run-id "${{ github.run_id }}" \
            --test-script "${{ matrix.test_script }}" \
            --runner "${RUNNER_NAME}" \
            --gpu-id "${{ env.CUDA_VISIBLE_DEVICES }}" \
            "${extra_args[@]}"

      - name: Check log
        if: ${{ !cancelled() && failure() }}
        continue-on-error: true
        run: |
          python .github/scripts/ci_tests.py check-log \
            --run-id "${{ github.run_id }}" \
            --test-script "${{ matrix.test_script }}"

      - name: Release GPU
        if: always() && env.SKIP_GPU_ALLOCATION != 'true'
        run: |
          python .github/scripts/ci_gpu.py release \
            --base-url "${GPU_ALLOCATOR_URL}" \
            --run-id "${{ github.run_id }}" \
            --gpu-id "${{ env.CUDA_VISIBLE_DEVICES }}" \
            --test "${{ matrix.test_script }}" \
            --runner "${RUNNER_NAME}"
