name: Model DSL compiler

on:
  pull_request:
    paths:
      - 'gptqmodel_compiler/**'
      - 'tests/compiler/**'
      - '.github/workflows/model_dsl_compiler.yml'
      - 'pyproject.toml'
  push:
    paths:
      - 'gptqmodel_compiler/**'
      - 'tests/compiler/**'
      - '.github/workflows/model_dsl_compiler.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  torch215-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14t'
      - name: Install isolated compiler dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy safetensors
      - name: Verify generated source, state and whole-model graph capture
        run: python -m pytest -q tests/compiler/test_compiler.py -o log_cli=false
