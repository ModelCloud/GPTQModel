name: AWQ CPU

on:
  pull_request:
    paths:
      - '.github/workflows/awq_cpu.yml'
      - 'gptqmodel/looper/**'
      - 'gptqmodel/quantization/**'
      - 'gptqmodel/models/**'
      - 'gptqmodel/nn_modules/qlinear/torch_awq.py'
      - 'gptqmodel/nn_modules/qlinear/torch_fused_awq.py'
      - 'gptqmodel/utils/calibration.py'
      - 'gptqmodel/nn_modules/qlinear/_numerics.py'
      - 'gptqmodel/nn_modules/qlinear/gemm_awq.py'
      - 'gptqmodel/nn_modules/qlinear/gemm_awq_triton.py'
      - 'gptqmodel/nn_modules/qlinear/_cpu_int4pack_layout.py'
      - 'gptqmodel/nn_modules/qlinear/_fused_train_state.py'
      - 'gptqmodel/nn_modules/qlinear/__init__.py'
      - 'gptqmodel/nn_modules/qlinear/torch_cpu_avx512_awq.py'
      - 'docs/**'
      - 'tests/test_awq_*.py'
      - 'tests/test_hf_bridge_*.py'
      - 'tests/test_hymba_awq_*.py'
      - 'tests/test_calibration_*.py'
      - 'tests/test_docs_contract_refs.py'
      - 'tests/module_tree/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awq-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: AWQ CPU (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, dense, moe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest pytest-timeout parameterized
      - name: Test CPU AWQ
        run: |
          case "${{ matrix.suite }}" in
            unit)
              python -m pytest tests/test_docs_contract_refs.py \
                tests/test_awq_scale_search_safety.py \
                tests/test_awq_moe_router_scaling.py tests/test_awq_scaling_groups.py \
                tests/test_awq_scale_folding.py tests/test_awq_empty_groups.py \
                tests/test_awq_mla_scaling.py tests/test_awq_weight_mean.py \
                tests/test_awq_per_module_bits.py tests/test_awq_position_kwargs.py \
                tests/test_awq_scale_search_memory.py \
                tests/test_awq_hybrid_recurrent_mask_4671.py \
                tests/test_rotation_format_gate_4666.py \
                tests/test_rotation_validate_first_4935.py \
                tests/test_awq_conv1d_gpt2_4887.py \
                tests/test_calibration_messages_tools_4858.py \
                tests/test_calibration_tools_formats_4934.py \
                tests/test_awq_hybrid_moe_root_4903.py \
                tests/test_awq_deepseek_v4_hash_moe_4880.py \
                tests/test_weight_only_failed_run_device_5011.py \
                tests/test_awq_torch_fused_mode_5018.py \
                tests/test_awq_hash_moe_kept_rows_5015.py \
                tests/test_awq_cohere2_moe_parallel_norm_4898.py \
                tests/test_cpu_int4_snapshot_5013.py \
                tests/test_training_kernel_inplace_4974.py \
                tests/test_peft_adalora_training_4974.py \
                tests/test_hymba_awq_4891.py \
                tests/test_smooth_percentile_bounds_5005.py \
                tests/test_hf_bridge_cpu_offload_5022.py \
                tests/test_failed_run_model_state_5009.py \
                tests/module_tree/test_awq_relationships.py \
                tests/module_tree/test_granitemoehybrid_model_tree.py \
                tests/module_tree/test_registered_module_plans.py \
                tests/module_tree/test_definition_subset_ordering.py \
                -q -o addopts='' -o log_cli=false --timeout=300 \
                -o junit_family=legacy --junitxml=awq-cpu-results.xml
              ;;
            dense|moe)
              python -m pytest tests/test_awq_hf_cpu.py -k '${{ matrix.suite }}' \
                -q -s -o addopts='' -o log_cli=false --timeout=300 \
                -o junit_family=legacy --junitxml=awq-cpu-results.xml
              ;;
          esac
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awq-cpu-${{ matrix.suite }}
          path: awq-cpu-results.xml
          if-no-files-found: warn
