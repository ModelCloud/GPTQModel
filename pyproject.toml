[build-system]
requires = [
    "setuptools>=77.0.3,<83",
]
build-backend = "setuptools.build_meta"

[project]
name = "GPTQModel"
dynamic = ["version", "dependencies"]
description = "Production ready LLM model compression/quantization toolkit with hw accelerated inference support for both cpu/gpu via HF, vLLM, and SGLang."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "ModelCloud", email = "qubitium@modelcloud.ai" },
]
keywords = ["gptq", "awq", "qqq", "autogptq", "autoawq", "eora", "gar", "quantization", "large-language-models", "transformers", "llm", "moe", "compression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ModelCloud/GPTQModel"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "parameterized>=0.9.0",
]
quality = [
    "ruff==0.16.5",
    # "isort==6.0.1",
]
vllm = [
    "vllm>=0.28.0",
    "flashinfer-python>=0.6.18",
]
sglang = [
    "sglang[srt]>=0.5.18",
    "flashinfer-python>=0.6.18",
]
bitblas = [
    "bitblas==0.1.0.post1",
]
bitsandbytes = [
    "bitsandbytes>=0.50.2",
]
hf = [
    "optimum>=2.3.0",
]
eval = [
    "Evalution>=0.0.17",
]
triton = [
    "triton>=3.8.0",
]
marlin-cuda12 = [
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cusparse-cu12==12.5.10.65",
    "nvidia-cusolver-cu12==11.7.5.82",
]
marlin-cuda = [
    "nvidia-cuda-runtime>=13.3.29",
    "nvidia-cublas>=13.6.1.10",
    "nvidia-cusparse>=12.8.2.51",
    "nvidia-cusolver>=12.2.6.9",
]
openai = [
    "uvicorn>=0.52.4",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
]
mlx = [
    "mlx_lm>=0.31.3",
]

[tool.uv]
torch-backend = "auto"
