[build-system]
requires = [
    "setuptools>=84.2.1,<85",
]
build-backend = "setuptools.build_meta"

[project]
name = "GPTQModel"
dynamic = ["version", "dependencies"]
description = "Production ready LLM model compression/quantization toolkit with hw accelerated inference support for both cpu/gpu via HF, vLLM, and SGLang."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "ModelCloud", email = "qubitium@modelcloud.ai" },
]
keywords = ["gptq", "awq", "qqq", "autogptq", "autoawq", "eora", "gar", "quantization", "large-language-models", "transformers", "llm", "moe", "compression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ModelCloud/GPTQModel"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "parameterized>=0.9.0",
]
quality = [
    "ruff==0.14.2",
    # "isort==6.0.1",
]
# Engine extras carry their own torch/transformers pins; use a dedicated environment.
vllm = [
    "vllm>=0.31.0; python_version < \"3.11\"",
    "vllm>=0.32.0; python_version >= \"3.11\" and python_version < \"3.15\"",
]
sglang = [
    "sglang[srt]>=0.5.21; python_version < \"3.11\"",
    "sglang[srt]>=0.5.22; python_version >= \"3.11\"",
]
bitblas = [
    "bitblas==0.1.0.post1",
]
bitsandbytes = [
    "bitsandbytes>=0.50.2",
]
gguf = [
    "gguf>=0.19.0",
    "llama-cpp-python>=0.3.36",
]
hf = [
    "optimum>=2.3.0",
]
eval = [
    "Evalution>=0.0.17",
]
triton = [
    "triton>=3.8.0; python_version < \"3.15\"",
]
marlin-cuda12 = [
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cusparse-cu12==12.5.10.65",
    "nvidia-cusolver-cu12==11.7.5.82",
]
marlin-cuda = [
    "nvidia-cuda-runtime>=13.4.92",
    "nvidia-cublas>=13.8.1.7",
    "nvidia-cusparse>=12.8.6.72",
    "nvidia-cusolver>=12.3.5.3",
]
openai = [
    "uvicorn>=0.54.0",
    "fastapi>=0.161.1",
    "pydantic>=2.14.1",
]
mlx = [
    "mlx>=0.32.4",
    "mlx_lm>=0.31.3; python_version < \"3.11\"",
    "mlx_lm>=0.32.2; python_version >= \"3.11\"",
]

# Single source of truth for lint/format rules. Keeping this at the repository
# root makes `ruff check` resolve the same configuration (and the same
# first-party import detection) no matter which directory it is invoked from.
[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W"]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E741", "W605", "E402", "F403", "F405", "E722", "E701"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["gptqmodel"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.uv]
torch-backend = "auto"
